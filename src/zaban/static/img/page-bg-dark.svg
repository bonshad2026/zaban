<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="78%" cy="32%" r="55%">
      <stop offset="0" stop-color="#c9a46a" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#8a6a3a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b0b0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="92%" r="40%">
      <stop offset="0" stop-color="#e3c58f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0b0b0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a46a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e3c58f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9a46a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0b0b0e"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- orbit rings around the glow -->
  <g fill="none" stroke="#c9a46a" stroke-width="0.6">
    <circle cx="1250" cy="290" r="180" stroke-opacity="0.14"/>
    <circle cx="1250" cy="290" r="260" stroke-opacity="0.09" stroke-dasharray="2 10"/>
    <circle cx="1250" cy="290" r="360" stroke-opacity="0.06"/>
    <circle cx="1250" cy="290" r="470" stroke-opacity="0.03" stroke-dasharray="1 14"/>
  </g>

  <!-- flowing lines, like sound waves -->
  <g fill="none" stroke="url(#wave)" stroke-width="0.7">
    <path d="M-40 700 C 240 620, 460 790, 720 700 S 1140 600, 1440 710 S 1600 760, 1660 730" stroke-opacity="0.45"/>
    <path d="M-40 580 C 200 500, 500 650, 760 570 S 1100 470, 1400 580 S 1600 620, 1660 600" stroke-opacity="0.3"/>
  </g>

  <!-- speech bubbles, drawn as outlines -->
  <g fill="none" stroke="#c9a46a" stroke-width="0.8" stroke-opacity="0.2">
    <path d="M1080 160 h230 a22 22 0 0 1 22 22 v90 a22 22 0 0 1 -22 22 h-160 l-40 34 v-34 h-30 a22 22 0 0 1 -22 -22 v-90 a22 22 0 0 1 22 -22 z"/>
    <path d="M1180 470 h170 a20 20 0 0 1 20 20 v64 a20 20 0 0 1 -20 20 h-120 l-30 26 v-26 h-20 a20 20 0 0 1 -20 -20 v-64 a20 20 0 0 1 20 -20 z" stroke-opacity="0.18"/>
  </g>
  <g fill="#c9a46a" fill-opacity="0.5">
    <circle cx="1140" cy="200" r="4"/>
    <circle cx="1190" cy="200" r="4" fill-opacity="0.35"/>
    <circle cx="1240" cy="200" r="4" fill-opacity="0.2"/>
  </g>
</svg>
