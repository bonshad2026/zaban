<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اطلاعات آموزشی | گفتاریار</title>
  <link id="bsCss" rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.rtl.min.css" data-rtl="/static/vendor/bootstrap/bootstrap.rtl.min.css" data-ltr="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-bilingual>
  <!--site-header-->
  <main class="page-main">
    <div class="page-wrap">
      <div class="page-stack">
        <p class="error" id="infoError" hidden></p>

        <section class="page-card" id="signedOutBox" hidden>
          <h2 class="accent-title" data-fa="اطلاعات آموزشی" data-en="Learning details">اطلاعات آموزشی</h2>
          <p data-fa="برای دیدن اطلاعات آموزشی ابتدا وارد شوید." data-en="Sign in to see your learning details.">برای دیدن اطلاعات آموزشی ابتدا وارد شوید.</p>
          <p><a class="pill gold" href="/login" data-fa="ورود" data-en="Sign in">ورود</a></p>
        </section>

        <form id="infoForm" class="page-card" novalidate hidden>
          <h2 class="accent-title" data-fa="اطلاعات آموزشی" data-en="Learning details">اطلاعات آموزشی</h2>
          <h2 data-fa="هدف از یادگیری" data-en="Your learning goal">هدف از یادگیری</h2>
          <label for="goal" data-fa="هدف از یادگیری" data-en="Your learning goal">هدف از یادگیری</label>
          <select id="goal">
            <option value="" data-fa="انتخاب کنید" data-en="Choose">انتخاب کنید</option>
            <option value="مکالمه‌ی روزمره" data-fa="مکالمه‌ی روزمره" data-en="Everyday conversation">مکالمه‌ی روزمره</option>
            <option value="سفر" data-fa="سفر" data-en="Travel">سفر</option>
            <option value="کار و شغل" data-fa="کار و شغل" data-en="Work">کار و شغل</option>
            <option value="آزمون" data-fa="آزمون" data-en="Exams">آزمون</option>
            <option value="مدرسه" data-fa="مدرسه" data-en="School">مدرسه</option>
          </select>

          <div id="learnerBox" hidden>
            <h2 data-fa="معلم و گفتگو" data-en="Teacher and conversation">معلم و گفتگو</h2>
            <label for="attributes" data-fa="دوست دارم معلمم چطور باشد" data-en="How I want my teacher to be">دوست دارم معلمم چطور باشد</label>
            <textarea id="attributes" rows="2" maxlength="1000" placeholder="مثلاً مهربان، با شوخی، صبور"></textarea>
            <label for="conversation" data-fa="دوست دارم چطور حرف بزنیم" data-en="How I like to talk">دوست دارم چطور حرف بزنیم</label>
            <select id="conversation">
              <option value="" data-fa="انتخاب نشده" data-en="Not chosen">انتخاب نشده</option>
              <option value="chat" data-fa="گفتگوی آزاد" data-en="Free chat">گفتگوی آزاد</option>
              <option value="story" data-fa="داستان ساختن با هم" data-en="Building stories together">داستان ساختن با هم</option>
              <option value="role_play" data-fa="نقش‌بازی" data-en="Role play">نقش‌بازی</option>
              <option value="quiz" data-fa="سؤال و جواب" data-en="Questions and answers">سؤال و جواب</option>
              <option value="mixed" data-fa="ترکیبی" data-en="Mixed">ترکیبی</option>
            </select>
            <label for="response" data-fa="سبک پاسخ معلم" data-en="Teacher's style">سبک پاسخ معلم</label>
            <select id="response">
              <option value="" data-fa="انتخاب نشده" data-en="Not chosen">انتخاب نشده</option>
              <option value="gentle" data-fa="ملایم" data-en="Gentle">ملایم</option>
              <option value="direct" data-fa="مستقیم" data-en="Direct">مستقیم</option>
              <option value="playful" data-fa="بازیگوش" data-en="Playful">بازیگوش</option>
              <option value="strict" data-fa="سخت‌گیر" data-en="Strict">سخت‌گیر</option>
            </select>
            <label for="sample" data-fa="یک جمله‌ی انگلیسی خودتان (اختیاری)" data-en="One English sentence from you (optional)">یک جمله‌ی انگلیسی خودتان (اختیاری)</label>
            <textarea id="sample" rows="2" maxlength="1000" class="ltr-field"></textarea>
            <label for="free" data-fa="هر چیز دیگری که معلم باید بداند" data-en="Anything else the teacher should know">هر چیز دیگری که معلم باید بداند</label>
            <textarea id="free" rows="3" maxlength="1000"></textarea>
          </div>

          <p class="muted" id="noLearner" hidden data-fa="برای دیدن سطح‌ها و تنظیمات معلم، ابتدا یادگیری خود را شروع کنید." data-en="Start your learning to see your levels and teacher settings.">برای دیدن سطح‌ها و تنظیمات معلم، ابتدا یادگیری خود را شروع کنید.</p>
          <p class="ok-msg" id="infoOk" hidden></p>
          <p><button type="submit" data-fa="ذخیره" data-en="Save">ذخیره</button></p>
        </form>
      </div>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/learning-info.js"></script>
</body>
</html>
