<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود | گفتاریار</title>
  <link id="bsCss" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" data-rtl="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" data-ltr="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <!--site-header-->
  <!-- Sign-in view: one sign-in for every adult, with a mobile number and a password -->
  <section id="loginView" class="hero" hidden>
    <div class="auth-wrap">
      <!-- Two ways in: the password chosen at sign-up, or a one-time code sent to the mobile by SMS -->
      <form id="loginForm" class="auth-card" autocomplete="on" novalidate>
        <h1 data-fa="ورود" data-en="Sign in">ورود</h1>
        <label for="loginPhone" data-fa="شماره‌ی موبایل" data-en="Mobile number">شماره‌ی موبایل</label>
        <input id="loginPhone" name="phone" type="tel" inputmode="tel" class="ltr-field" autocomplete="username" placeholder="09121234567" autofocus>

        <div id="passwordPart">
          <label for="loginPassword" data-fa="رمز عبور" data-en="Password">رمز عبور</label>
          <input id="loginPassword" name="password" type="password" class="ltr-field" autocomplete="current-password">
        </div>

        <div id="codePart" hidden>
          <p class="notice" id="loginDevHint" hidden></p>
          <div class="field-action">
            <div>
              <label for="loginCode" data-fa="کد پیامکی" data-en="SMS code">کد پیامکی</label>
              <input id="loginCode" name="code" inputmode="numeric" class="ltr-field" autocomplete="one-time-code" maxlength="8">
            </div>
            <div class="send-slot">
              <button type="button" id="loginSendBtn" class="secondary" data-fa="ارسال کد پیامکی" data-en="Send SMS code">ارسال کد پیامکی</button>
              <span class="resend-wait muted" id="loginResendWait" hidden></span>
            </div>
          </div>
        </div>

        <button type="submit" class="wide" id="loginSubmit" data-fa="ورود" data-en="Sign in">ورود</button>
        <p class="error" id="loginError" hidden></p>
        <p class="links"><a href="#" id="codeModeLink" data-fa="ورود با کد پیامکی" data-en="Sign in with an SMS code">ورود با کد پیامکی</a> · <a href="#" id="forgotLink" data-fa="رمز عبور را فراموش کرده‌ام" data-en="I forgot my password">رمز عبور را فراموش کرده‌ام</a> · <a href="/signup" data-fa="ثبت‌نام" data-en="Sign up">ثبت‌نام</a></p>
      </form>

      <!-- Reset view: a one-time code is sent by SMS, then a new password is set -->
      <form id="resetForm" class="auth-card" hidden novalidate>
        <a class="back" href="#" id="backToLogin" data-fa="بازگشت به ورود" data-en="Back to sign in">بازگشت به ورود</a>
        <h1 data-fa="بازیابی رمز عبور" data-en="Reset password">بازیابی رمز عبور</h1>
        <div class="field-action">
          <div>
            <label for="resetPhone" data-fa="شماره‌ی موبایل" data-en="Mobile number">شماره‌ی موبایل</label>
            <input id="resetPhone" name="phone" type="tel" inputmode="tel" class="ltr-field" placeholder="09121234567" required>
          </div>
          <div class="send-slot">
            <button type="button" id="resetSendBtn" class="secondary" data-fa="ارسال کد" data-en="Send code">ارسال کد</button>
            <span class="resend-wait muted" id="resetResendWait" hidden></span>
          </div>
        </div>
        <div id="resetStep" hidden>
          <p class="notice" id="resetDevHint" hidden></p>
          <label for="resetCode" data-fa="کد پیامکی" data-en="SMS code">کد پیامکی</label>
          <input id="resetCode" name="code" inputmode="numeric" class="ltr-field" autocomplete="one-time-code" maxlength="8">
          <label for="resetPassword" data-fa="رمز جدید (حداقل ۸ نویسه)" data-en="New password (at least 8 characters)">رمز جدید (حداقل ۸ نویسه)</label>
          <input id="resetPassword" name="password" type="password" class="ltr-field" minlength="8" required>
          <p></p>
          <button type="submit" class="wide" data-fa="ذخیره‌ی رمز جدید" data-en="Save new password">ذخیره‌ی رمز جدید</button>
        </div>
        <p class="error" id="resetError" hidden></p>
        <p class="ok-msg" id="resetOk" hidden></p>
      </form>
    </div>
  </section>

  <!-- App view: only the plan and its purchase. A paid adult is sent to the learning page. -->
  <div id="appView" hidden>
    <main class="wrap">
      <section class="card" id="billingCard">
        <h2 data-fa="پلن و پرداخت" data-en="Plan and payment">پلن و پرداخت</h2>
        <p id="planStatus" class="muted"></p>
        <p class="ok-msg" id="paymentNotice" hidden></p>
        <div class="row" id="planList"></div>
        <p class="error" id="billingError" hidden></p>
      </section>
    </main>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
