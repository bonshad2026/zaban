<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تعیین سطح | گفتاریار</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-bilingual>
  <!--site-header-->
  <main class="page-main">
    <div class="page-wrap">
      <div class="page-stack">
        <h1 class="page-title accent-title" data-fa="تعیین سطح" data-en="Set level">تعیین سطح</h1>
        <p class="error" id="levelError" hidden></p>
        <p class="notice" id="levelNotice" hidden></p>

        <section class="page-card">
          <h2 data-fa="سطح هر مهارت" data-en="Level of each skill">سطح هر مهارت</h2>
          <p class="muted" data-fa="هر مهارت سطح جدا دارد. برای هر مهارت می‌توانید آزمون بدهید یا سطحتان را خودتان انتخاب کنید. اگر آزمونی را رد کنید، سطح مقدماتی (A1) ثبت می‌شود."
             data-en="Each skill has its own level. Take the test for a skill, or choose your level yourself. If you skip a test, the beginner level (A1) is saved.">هر مهارت سطح جدا دارد. برای هر مهارت می‌توانید آزمون بدهید یا سطحتان را خودتان انتخاب کنید. اگر آزمونی را رد کنید، سطح مقدماتی (A1) ثبت می‌شود.</p>
          <div id="skillRows" class="skill-rows"></div>
        </section>
      </div>
    </div>
  </main>

  <dialog id="testDialog" class="account-dialog" aria-labelledby="testTitle">
    <h2 id="testTitle"></h2>
    <p class="error" id="testError" hidden></p>

    <div id="testIntro" hidden>
      <p class="muted" id="testIntroText"></p>
      <div class="dialog-actions">
        <button type="button" class="ghost" data-close data-fa="بستن" data-en="Close">بستن</button>
        <button type="button" id="testBegin" data-fa="شروع آزمون" data-en="Start the test">شروع آزمون</button>
      </div>
    </div>

    <div id="testCard" hidden>
      <p class="muted" id="testProgress"></p>
      <p id="testText" class="test-text"></p>
      <p><button type="button" id="testListen" class="ghost" hidden data-fa="پخش دوباره" data-en="Play again">پخش دوباره</button></p>
      <div id="testOptions" class="test-options"></div>
      <div class="dialog-actions">
        <button type="button" class="ghost" data-close data-fa="بستن و ادامه بعداً" data-en="Close and continue later">بستن و ادامه بعداً</button>
        <button type="button" class="ghost" id="testSkip" data-fa="رد کردن این بخش" data-en="Skip this part">رد کردن این بخش</button>
      </div>
    </div>

    <div id="testResult" hidden>
      <p class="test-text" id="testResultText"></p>
      <div class="dialog-actions">
        <button type="button" data-close data-fa="بستن" data-en="Close">بستن</button>
      </div>
    </div>
  </dialog>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/level.js"></script>
</body>
</html>
