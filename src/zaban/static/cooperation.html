<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درخواست همکاری | زبان</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-bilingual>
  <!--site-header-->
  <main class="page-main">
    <div class="page-wrap">
      <div class="page-stack">
        <h1 class="page-title accent-title" data-fa="درخواست همکاری" data-en="Cooperation request">درخواست همکاری</h1>

        <div class="reveal">
          <form id="cooperationForm" class="page-card form-grid" novalidate>
            <h2 class="full" data-fa="فرم درخواست همکاری" data-en="Cooperation request form">فرم درخواست همکاری</h2>

            <div class="full">
              <label for="coopSubject" data-fa="موضوع همکاری" data-en="Subject of cooperation">موضوع همکاری</label>
              <input id="coopSubject" name="subject" maxlength="160" required>
            </div>

            <div>
              <label for="coopPhone" data-fa="شماره‌ی تماس" data-en="Phone number">شماره‌ی تماس</label>
              <input id="coopPhone" name="phone" type="tel" inputmode="tel" class="ltr-field" placeholder="09121234567" required>
            </div>
            <div>
              <label for="coopEmail" data-fa="ایمیل (اختیاری)" data-en="Email (optional)">ایمیل (اختیاری)</label>
              <input id="coopEmail" name="email" type="email" maxlength="190" class="ltr-field">
            </div>

            <div class="full">
              <label for="coopMessage" data-fa="توضیحات و شرح درخواست" data-en="Details of your request">توضیحات و شرح درخواست</label>
              <textarea id="coopMessage" name="message" rows="6" maxlength="2000"></textarea>
            </div>

            <div class="page-submit">
              <button type="submit" class="wide" data-fa="ارسال درخواست" data-en="Send request">ارسال درخواست</button>
            </div>
            <p class="error full" id="coopError" hidden></p>
          </form>

          <section class="page-card" id="coopDone" hidden>
            <h2 data-fa="درخواست شما ثبت شد" data-en="Your request was sent">درخواست شما ثبت شد</h2>
            <p class="muted" data-fa="به‌زودی با شما تماس می‌گیریم." data-en="We will contact you soon.">به‌زودی با شما تماس می‌گیریم.</p>
            <div class="row">
              <a class="btn-link" href="/" data-fa="صفحه‌ی اول" data-en="Home page">صفحه‌ی اول</a>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/cooperation.js"></script>
</body>
</html>
