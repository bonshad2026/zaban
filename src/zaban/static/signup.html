<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت‌نام | گفتاریار</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-bilingual>
  <!--site-header-->
  <main class="hero">
    <div class="auth-wrap">
      <form id="signupForm" class="auth-card auth-wide" autocomplete="on" novalidate>
        <h1 data-fa="ثبت‌نام" data-en="Sign up">ثبت‌نام</h1>
        <p class="muted" data-fa="ثبت‌نام رایگان است. پس از ورود، برای شروع یک پلن را انتخاب می‌کنید." data-en="Sign-up is free. After you sign in, choose a plan to start.">ثبت‌نام رایگان است. پس از ورود، برای شروع یک پلن را انتخاب می‌کنید.</p>

        <div id="signupStep" class="auth-grid">
          <div>
            <label for="signupName" data-fa="نام و نام خانوادگی" data-en="Full name">نام و نام خانوادگی</label>
            <input id="signupName" name="full_name" maxlength="120" autocomplete="name" required autofocus>
          </div>

          <div>
            <label for="signupPhone" data-fa="شماره‌ی موبایل" data-en="Mobile number">شماره‌ی موبایل</label>
            <input id="signupPhone" name="phone" type="tel" inputmode="tel" class="ltr-field" autocomplete="tel" placeholder="09121234567" required>
          </div>

          <div>
            <label for="signupPassword" data-fa="رمز عبور (حداقل ۸ نویسه)" data-en="Password (at least 8 characters)">رمز عبور (حداقل ۸ نویسه)</label>
            <input id="signupPassword" name="password" type="password" class="ltr-field" minlength="8" autocomplete="new-password" required>
          </div>

          <div>
            <label for="signupPassword2" data-fa="تکرار رمز عبور" data-en="Repeat password">تکرار رمز عبور</label>
            <input id="signupPassword2" name="password_repeat" type="password" class="ltr-field" minlength="8" autocomplete="new-password" required>
          </div>

          <div>
            <label for="signupReferral" data-fa="کد معرف (اختیاری)" data-en="Referral code (optional)">کد معرف (اختیاری)</label>
            <input id="signupReferral" name="referral_code" class="ltr-field" maxlength="12" autocomplete="off" placeholder="ABC123">
          </div>

          <p class="notice full" id="signupDevHint" hidden></p>

          <div class="full field-action">
            <div>
              <label for="signupCode" data-fa="کد پیامکی" data-en="SMS code">کد پیامکی</label>
              <input id="signupCode" name="code" inputmode="numeric" class="ltr-field" autocomplete="one-time-code" maxlength="8">
            </div>
            <button type="button" id="sendCodeBtn" class="secondary" data-fa="ارسال کد پیامکی" data-en="Send SMS code">ارسال کد پیامکی</button>
          </div>
          <p class="muted full" id="signupTimer" hidden></p>

          <div class="full">
            <label class="inline"><input type="checkbox" name="consent" required> <span data-fa="قوانین استفاده و حریم خصوصی را می‌پذیرم." data-en="I accept the terms of use and privacy policy.">قوانین استفاده و حریم خصوصی را می‌پذیرم.</span></label>
          </div>

          <button type="submit" class="wide full" data-fa="ساخت حساب" data-en="Create account">ساخت حساب</button>
        </div>

        <p class="error" id="signupError" hidden></p>
        <p class="links"><span data-fa="حساب دارید؟" data-en="Already have an account?">حساب دارید؟</span> <a href="/parent" data-fa="وارد شوید" data-en="Sign in">وارد شوید</a></p>
      </form>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/signup.js"></script>
</body>
</html>
