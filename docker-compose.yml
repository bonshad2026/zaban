services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zaban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: zaban
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaban -d zaban"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://zaban:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}@db:5432/zaban
    ports:
      - "${ZABAN_PORT:-8020}:8000"

volumes:
  pgdata:
