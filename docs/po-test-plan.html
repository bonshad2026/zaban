<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فهرست تست گفتاریار</title>
<style>
:root { --bg:#f7f7f5; --card:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --border:#dcdcd8; --accent:#2f6fdb; --done:#e8f4ea; --done-text:#2c6e3a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16171a; --card:#1f2024; --text:#ececf0; --muted:#9a9aa3; --border:#34353b; --accent:#7aa6ff; --done:#1f2d22; --done-text:#9fd8a8; } }
:root[data-theme="dark"] { --bg:#16171a; --card:#1f2024; --text:#ececf0; --muted:#9a9aa3; --border:#34353b; --accent:#7aa6ff; --done:#1f2d22; --done-text:#9fd8a8; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Tahoma, sans-serif; line-height:1.7; }
main { max-width:920px; margin:0 auto; padding:16px; }
h1 { font-size:1.5rem; margin:8px 0; }
h2 { font-size:1.15rem; margin:28px 0 8px; border-bottom:1px solid var(--border); padding-bottom:4px; }
h3 { font-size:1rem; margin:18px 0 6px; color:var(--muted); }
.bar { position:sticky; top:0; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:12px 0; z-index:2; }
.progress { height:8px; background:var(--border); border-radius:6px; overflow:hidden; margin:6px 0; }
.progress > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
.row-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button, select { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer; }
button:hover, select:hover { border-color:var(--accent); }
.item { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:8px 0; }
.item.done { background:var(--done); }
.item label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
.item input[type=checkbox] { width:20px; height:20px; margin-top:4px; flex:0 0 auto; accent-color:var(--accent); }
.item .id { font-weight:700; direction:ltr; display:inline-block; min-width:72px; }
.item .expected { color:var(--muted); font-size:.95rem; margin-top:4px; }
.item.done .expected { color:var(--done-text); }
.note { width:100%; box-sizing:border-box; margin-top:8px; background:var(--bg); color:var(--text); border:1px dashed var(--border); border-radius:8px; padding:6px 8px; font:inherit; }
.hidden { display:none !important; }
.muted { color:var(--muted); }
code { direction:ltr; display:inline-block; }
</style>
</head>
<body>
<main>
<h1>فهرست تست گفتاریار</h1>
<p class="muted">هر مورد را بعد از انجام تست تیک بزنید. اگر نتیجه با مطلوب فرق داشت، تیک نزنید و در یادداشت بنویسید. وضعیت در همین مرورگر ذخیره می‌شود. متن کامل همین فهرست در <code>docs/po-test-plan.md</code> است.</p>

<div class="bar">
  <div id="summary"></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="row-tools">
    <select id="filter" aria-label="فیلتر">
      <option value="all">همه</option>
      <option value="todo">فقط مانده‌ها</option>
      <option value="done">فقط انجام‌شده‌ها</option>
    </select>
    <button type="button" id="export">خروجی متنی</button>
    <button type="button" id="reset">پاک کردن همه‌ی تیک‌ها</button>
  </div>
</div>

<div id="list"></div>
</main>

<script>
const SECTIONS = [{"title": "۰. آماده‌سازی محیط", "items": [{"id": "ENV-01", "step": "در پوشه‌ی پروژه `docker compose up -d --build` را اجرا کنید. سپس `http://127.0.0.1:8020` را باز کنید.", "expected": "صفحه‌ی اصلی بالا می‌آید و خطایی در ترمینال نیست."}, {"id": "ENV-02", "step": "مرورگر را Chrome یا Edge بگیرید. برای صدا میکروفون را اجازه دهید.", "expected": "Firefox و Safari برای تشخیص صدا پشتیبانی ندارند؛ اگر از آن‌ها تست می‌کنید، یادداشت کنید."}, {"id": "ENV-03", "step": "یک حساب بزرگسال تازه از `/signup` بسازید.", "expected": "ثبت‌نام با کد پیامکی انجام می‌شود. در محیط توسعه کد در `/dev/sms-outbox` دیده می‌شود."}, {"id": "ENV-04", "step": "به `/admin` بروید و با رمز مدیریت وارد شوید.", "expected": "ورود انجام می‌شود و پنل با گروه‌های منو باز می‌شود."}, {"id": "ENV-05", "step": "بسته به نیاز از یک پلن تستی استفاده کنید (بخش BILL).", "expected": "حساب بعد از فعال‌سازی پلن می‌تواند درس را شروع کند."}]}, {"title": "۱. ورود، ثبت‌نام و رمز", "items": [{"id": "AUTH-01", "step": "در `/signup` شماره‌ی موبایل بدهید و کد پیامکی را وارد کنید.", "expected": "حساب ساخته می‌شود و وارد صفحه می‌شوید."}, {"id": "AUTH-02", "step": "از `/login` با شماره و رمز وارد شوید.", "expected": "ورود انجام می‌شود، هدر حساب را نشان می‌دهد و نیازی به رفرش نیست."}, {"id": "AUTH-03", "step": "سه بار رمز اشتباه بزنید.", "expected": "بعد از سه بار ورود ۱۵ دقیقه قفل می‌شود و پیام مناسب می‌آید."}, {"id": "AUTH-04", "step": "برای یک شماره بیشتر از یک بار در دقیقه کد بخواهید.", "expected": "درخواست دوم در همان دقیقه پذیرفته نمی‌شود."}, {"id": "AUTH-05", "step": "کد پیامکی را پنج بار اشتباه وارد کنید.", "expected": "بعد از پنج تلاش کد دیگر کار نمی‌کند."}, {"id": "AUTH-06", "step": "«فراموشی رمز» را انجام دهید.", "expected": "با کد پیامکی رمز جدید تنظیم می‌شود."}, {"id": "AUTH-07", "step": "در پروفایل «خروج از همه‌ی دستگاه‌ها» را بزنید (در یک مرورگر دیگر هم وارد شده باشید).", "expected": "نشست دیگر بسته می‌شود و باید دوباره وارد شوید."}, {"id": "AUTH-08", "step": "از پروفایل فیلدها را بررسی کنید: نام، ایمیل، سن، جنسیت، عکس، رمز.", "expected": "فقط همین فیلدها هستند. هیچ گزینه‌ی کودک، والدین یا پایه‌ی تحصیلی نیست."}]}, {"title": "۲. حریم خصوصی و بزرگسال بودن", "items": [{"id": "PRIV-01", "step": "در کل سایت دنبال گزینه‌ی سن کمتر از ۱۸، «والد»، «پایه‌ی تحصیلی» یا «دانش‌آموز مدرسه» بگردید.", "expected": "چنین گزینه‌ای نیست."}, {"id": "PRIV-02", "step": "در درس بگویید: «My phone is 0912…» یا نام کامل خود را بگویید.", "expected": "شریک نام، شماره یا آدرس را دوباره نمی‌پرسد و تکرار نمی‌کند."}, {"id": "PRIV-03", "step": "در درس یک لینک (مثلاً `http://example.com`) یا یک ایمیل بفرستید.", "expected": "پیام قبل از رسیدن به مدل بلاک می‌شود و پیام راهنما می‌آید."}, {"id": "PRIV-04", "step": "در درس یک شماره‌ی بلند (مثلاً ۱۲ رقم) بفرستید.", "expected": "پیام بلاک می‌شود."}, {"id": "PRIV-05", "step": "در پنل، دفترچه‌ی زبان‌آموز را بخوانید (بخش NOTE).", "expected": "هیچ نام کامل، شماره، آدرس یا رمزی در دفترچه نیست."}, {"id": "PRIV-06", "step": "در محیط واقعی (ENVIRONMENT=production) به `/dev/sms-outbox` و `/dev/pay/...` بروید.", "expected": "باز نمی‌شوند. (این مورد را توسعه‌دهنده بررسی کند.)"}, {"id": "PRIV-07", "step": "در محیط واقعی به `/docs` بروید.", "expected": "باز نمی‌شود. (فقط در حالت توسعه باز است.)"}]}, {"title": "۳. سطح‌ها", "items": [{"id": "LVL-01", "step": "در `/level` ببینید چه گزینه‌هایی هست.", "expected": "گزینه‌ی «گفتار و نوشتار» (بدون آزمون)، و آزمون‌های شنیداری، خواندن و دستور هست."}, {"id": "LVL-02", "step": "قبل از اولین جلسه سطح گفتار و نوشتار را انتخاب کنید.", "expected": "انتخاب ذخیره می‌شود. پنج معیار (دامنه، دقت، روانی، تعامل، انسجام) از همین سطح شروع می‌کنند."}, {"id": "LVL-03", "step": "یک جلسه کامل انجام دهید، سپس به `/level` و پروفایل برگردید.", "expected": "سطح گفتاری دیگر قابل تغییر نیست. فقط نمایش داده می‌شود."}, {"id": "LVL-04", "step": "آزمون تعیین سطح را انجام دهید.", "expected": "فقط شنیداری، خواندن و دستور سنجیده می‌شود. آزمون بخش گفتاری ندارد."}, {"id": "LVL-05", "step": "در صفحه‌ی پیشرفت پنج معیار را ببینید.", "expected": "نمایش دارد اما دکمه‌ی ویرایش نیست."}]}, {"title": "۴. طرح، پرداخت، توکن و هشدار", "items": [{"id": "BILL-01", "step": "در `/plan` پلن‌های فعال را ببینید.", "expected": "فقط پلن‌های فعال نشان داده می‌شوند."}, {"id": "BILL-02", "step": "یک پلن را خریداری کنید (در توسعه، از جریان پرداخت آزمایشی).", "expected": "بعد از تأیید، پلن فعال و در `/payments` ثبت می‌شود."}, {"id": "BILL-03", "step": "بدون پلن فعال، شروع درس را امتحان کنید.", "expected": "شروع درس مسدود می‌شود و پیام راهنما می‌آید."}, {"id": "BILL-04", "step": "پرداخت ناموفق را شبیه‌سازی کنید (بازگشت از درگاه با خطا).", "expected": "به `/plan?payment=failed` می‌روید و پیام شکست نشان داده می‌شود."}, {"id": "BILL-05", "step": "در پنل سقف توکن یک پلن را کم بگذارید و توکن را مصرف کنید تا ۲۰٪ باقی‌مانده.", "expected": "بالای صفحه‌ی زبان‌آموز کادر هشدار با متن «فقط ۲۰٪ از توکن‌های پلن شما باقی مانده است» می‌آید."}, {"id": "BILL-06", "step": "مصرف را تا ۱۰٪ باقی‌مانده ببرید.", "expected": "هشدار دوم (۱۰٪ باقی‌مانده) می‌آید."}, {"id": "BILL-07", "step": "سه روز مانده به انقضای پلن را شبیه‌سازی کنید (یا تاریخ انقضا را در پنل تغییر دهید).", "expected": "هشدار انقضا نشان داده می‌شود. روز آخر هم دوباره هشدار می‌آید."}, {"id": "BILL-08", "step": "پلن را منقضی کنید در وسط یک جلسه.", "expected": "جلسه‌ی جاری تا آخر ادامه پیدا می‌کند، پیام انقضا می‌آید و جلسه‌ی تازه باز نمی‌شود."}, {"id": "BILL-09", "step": "توکن را تا نزدیک ذخیره‌ی پایان جلسه (پیش‌فرض ۵٬۰۰۰) مصرف کنید.", "expected": "گفتگو با پیام «توکن‌هایت تمام شد» بسته می‌شود و خلاصه‌ی پایان ساخته می‌شود."}, {"id": "BILL-10", "step": "پلن را در پنل مدیر حذف کنید در حالی که پرداخت دارد.", "expected": "حذف انجام نمی‌شود."}]}, {"title": "۵. کد معرف و تعیین مربی", "items": [{"id": "REF-01", "step": "در `/referrals` کد معرف خود را ببینید.", "expected": "کد شش‌کاراکتری است. از حروف شبیه عدد (۰، O، ۱، I، L) خبری نیست."}, {"id": "REF-02", "step": "با حساب دوم و با کد معرف اولی ثبت‌نام کنید.", "expected": "در `/referrals` شمارش «کل» یک نفر زیاد می‌شود و فقط نام او دیده می‌شود."}, {"id": "REF-03", "step": "برای حساب دوم یک پلن فعال کنید.", "expected": "شمارش «دارای پلن» یک نفر زیاد می‌شود."}, {"id": "TEACH-01", "step": "در هدر، منوی حساب، «تعیین مربی» را باز کنید. کد نامعتبری وارد کنید.", "expected": "پیام «کد مربی معتبر نیست» (یا معادل فارسی) می‌آید."}, {"id": "TEACH-02", "step": "کد معرف خودتان را وارد کنید.", "expected": "خطای «نمی‌توانید خودتان را مربی خود کنید» می‌آید."}, {"id": "TEACH-03", "step": "کد معتبر یک مربی را وارد کنید، ولی تیک «این مربی من است» را نزنید.", "expected": "تأیید لازم است و انتخاب انجام نمی‌شود."}, {"id": "TEACH-04", "step": "کد را وارد کرده و تأیید کنید.", "expected": "نام مربی نشان داده می‌شود و انتخاب انجام می‌شود."}, {"id": "TEACH-05", "step": "یک مربی دیگر انتخاب کنید.", "expected": "فقط یک مربی در هر لحظه است؛ مربی قبلی جایگزین می‌شود."}, {"id": "TEACH-06", "step": "مربی را حذف کنید.", "expected": "مربی حذف می‌شود و در صفحه‌ی `/students` مربی دیده نمی‌شود."}, {"id": "TEACH-07", "step": "با حساب مربی، صفحه‌ی `/students` را باز کنید.", "expected": "فقط زبان‌آموزانی را می‌بینید که شما را انتخاب کرده‌اند، با گزارش و پیشرفتشان. زبان‌آموز دیگری دیده نمی‌شود."}, {"id": "TEACH-08", "step": "با حساب مربی دفترچه‌ی گفتاریار یا پیام‌های جلسه‌ها را پیدا کنید.", "expected": "دسترسی ندارید؛ فقط مدیر دفترچه را می‌بیند."}]}, {"title": "۶. صفحه‌ی زبان‌آموز `/student`", "items": [{"id": "STU-01", "step": "`/student` را باز کنید.", "expected": "تب‌ها به این ترتیب باشند: جلسه، لهجه، گزارش من، پیشرفت، کمک‌آموزشی، خودت رو محک بزن، پرداخت‌ها."}, {"id": "STU-02", "step": "در تب «لهجه» لهجه‌ها را ببینید و یکی را انتخاب کنید (مثلاً en-GB).", "expected": "انتخاب ذخیره می‌شود و بعد از رفرش هم می‌ماند."}, {"id": "STU-03", "step": "در تب «گزارش من» گزارش را باز کنید.", "expected": "گزارش جلسه‌ها و خلاصه‌ها دیده می‌شود."}, {"id": "STU-04", "step": "در تب «پیشرفت» فهرست عبارت‌ها را ببینید.", "expected": "هر عبارت وضعیت دارد: دیده‌شده، به‌کار رفته یا تسلط."}, {"id": "STU-05", "step": "در «کمک‌آموزشی» یک گروه و یک فیلتر را امتحان کنید.", "expected": "محتوا فیلتر می‌شود و با برچسب درست نشان داده می‌شود."}, {"id": "STU-06", "step": "در تب «پرداخت‌ها» پرداخت‌های قبلی را ببینید.", "expected": "فهرست درست است."}, {"id": "STU-07", "step": "منوی هدر را باز کنید و «گفتگوی آزاد» را بزنید.", "expected": "به `/student?free=1` می‌روید و گفتگوی آزاد باز می‌شود."}, {"id": "STU-08", "step": "کل صفحه را با زبان انگلیسی (`EN`) و فارسی ببینید.", "expected": "همه‌ی متن‌های ثابت ترجمه می‌شوند و جهت صفحه عوض می‌شود."}]}, {"title": "۷. درس (جلسه‌ی ساخت‌یافته)", "items": []}, {"title": "۷.۱ شروع و پاسخ", "items": [{"id": "LES-01", "step": "در تب «جلسه» درس را شروع کنید.", "expected": "جلسه شروع می‌شود و بالای صفحه «الان: …» نشان داده می‌شود."}, {"id": "LES-02", "step": "بدون اینکه چیزی بنویسید، شریک منتظر بماند.", "expected": "شریک خودش با یک جمله‌ی شروع کوتاه جلسه را شروع می‌کند."}, {"id": "LES-03", "step": "یک جمله‌ی انگلیسی بنویسید و Send بزنید.", "expected": "پیام در چت می‌آید و پاسخ بعد از چند لحظه نشان داده می‌شود."}, {"id": "LES-04", "step": "در حالی که شریک در حال پاسخ است، تلاش کنید پیام بفرستید.", "expected": "دکمه‌ی ارسال غیرفعال است. Send تنها راه ارسال است."}, {"id": "LES-05", "step": "پاسخ شریک را ببینید.", "expected": "پاسخ در حباب چت است. متن انگلیسی راست به چپ نیست (`ltr`) حتی در صفحه‌ی فارسی."}, {"id": "LES-06", "step": "جمله‌ای با خطای زمان بنویسید (مثلاً: Yesterday I go to school).", "expected": "کارت خطا با جمله‌ی شما و نسخه‌ی درست نشان داده می‌شود. نوع خطا یکی از هفت دسته است (زمان، ترتیب کلمات، حرف اضافه، ترجمه‌ی تحت‌اللفظی، حرف تعریف، لحن، تلفظ)."}, {"id": "LES-07", "step": "شریک یک عبارت جدید بدهد (اگر داد).", "expected": "کارت عبارت با متن، موقعیت کاربرد و لحن نشان داده می‌شود."}, {"id": "LES-08", "step": "چند پیام بفرستید و تعداد علامت سؤال در هر پاسخ شریک را بشمارید.", "expected": "هر پیام حداکثر یک سؤال دارد."}, {"id": "LES-09", "step": "فارسی بنویسید و بپرسید «این یعنی چه؟».", "expected": "شریک یک جمله‌ی فارسی کوتاه برای رفع ابهام می‌گوید و بعد به انگلیسی برمی‌گردد."}, {"id": "LES-10", "step": "از سرور خروجی نامعتبر بگیرد (فقط توسعه؛ توسعه‌دهنده شبیه‌سازی کند).", "expected": "متن خام به‌عنوان پاسخ نشان داده می‌شود و هیچ خطا یا عبارتی در پروفایل ثبت نمی‌شود."}]}, {"title": "۷.۲ ریتم و حالت‌ها", "items": [{"id": "LES-11", "step": "در یک جلسه ۲۰ دقیقه‌ای ریتم را ببینید.", "expected": "ریتم پیش‌فرض: گفتگو ۱۲ دقیقه، ترجمه‌ی ذهنی ۴ دقیقه، مرور عبارت‌ها ۲ دقیقه، جمع‌بندی ۲ دقیقه."}, {"id": "LES-12", "step": "از یک قسمت به قسمت دیگر بروید.", "expected": "قسمت جدید فعال می‌شود و «الان» تغییر می‌کند. پیشرفت قسمت قبلی ذخیره می‌شود."}, {"id": "LES-13", "step": "ترتیب، تعداد یا زمان قسمت‌ها را در ریتم عوض کنید.", "expected": "تغییر ذخیره می‌شود و در صفحه بعدی هم دیده می‌شود."}, {"id": "LES-14", "step": "در قسمت ترجمه‌ی ذهنی، یک جمله‌ی فارسی بگیرید.", "expected": "جمله‌ی فارسی کوتاه از زندگی شما است و تایمر آن بر اساس سطح روانی است (A1: ۲۰ ثانیه، A2: ۱۵، B1: ۱۰، B2 به بالا: ۷)."}, {"id": "LES-15", "step": "زمان ترجمه تمام شود و جمله نگویید.", "expected": "شریک شروع جمله را نشان می‌دهد («Start with: I…») و دوباره بخواهد."}, {"id": "LES-16", "step": "در حالت شادوینگ یک جمله تکرار کنید.", "expected": "شریک جمله‌ی هدف را می‌دهد و بازخورد ریتم و تکیه می‌گیرد."}, {"id": "LES-17", "step": "در حالت «عبارت‌ها و اصطلاحات» یک عبارت بیاموزید.", "expected": "عبارت با موقعیت و مثال می‌آید؛ بعد از شما خواسته می‌شود یک جمله‌ی خودتان بسازید."}, {"id": "LES-18", "step": "در حالت «محاوره‌ای کردن» یک جمله‌ی رسمی بدهید.", "expected": "نسخه‌ی محاوره‌ای و توضیح کاربرد (کجا می‌شود گفت و کجا نه) نشان داده می‌شود."}, {"id": "LES-19", "step": "در حالت «داستان کوتاه» داستان را بشنوید.", "expected": "سه پرسش درک پرسیده می‌شود و طول داستان متناسب با سطح است (A1: ۵ تا ۸ جمله، A2: ۸ تا ۱۲، B1: ۱۲ تا ۲۰، B2: ۲۰ تا ۳۰)."}, {"id": "LES-20", "step": "در حالت «شعر و ریتم» یک شعر بخواهید.", "expected": "شعر با ترجمه‌ی تحت‌اللفظی می‌آید و متن بدون مجوز نیست."}, {"id": "LES-21", "step": "در حالت «گفتگوی هدف‌دار» موقعیتی مثل رزرو هتل بگیرید.", "expected": "شریک موقعیت و هدف را می‌گوید، نقش طرف مقابل را بازی می‌کند و در پایان هدف (مثلاً اتاق رزرو شده) تأیید می‌شود."}, {"id": "LES-22", "step": "در حالت «تکرار زمان‌دار» موضوع کوتاهی را در ۴، ۳ و ۲ دقیقه تعریف کنید.", "expected": "شریک سه نوبت را جدا نشان می‌دهد و زمان‌سنجی را با تایمر شما انجام می‌دهد (سامانه زمان را از پیام‌ها نمی‌سنجد)."}]}, {"title": "۷.۳ زمان و پایان", "items": [{"id": "LES-23", "step": "جلسه را تا پایان زمان (۲۰ دقیقه) ادامه دهید.", "expected": "یک بار پیام «زمان تمام شد، ادامه می‌دهی؟» می‌آید. جلسه خودکار بسته نمی‌شود."}, {"id": "LES-24", "step": "«ادامه» را انتخاب کنید.", "expected": "پیام «ادامه می‌دهیم. هر وقت خواستی، دکمه‌ی پایان را بزن.» می‌آید و جلسه بدون محدودیت زمان ادامه پیدا می‌کند. پیام زمان دوباره نمی‌آید."}, {"id": "LES-25", "step": "قبل از پایان زمان دکمه‌ی «پایان جلسه» را بزنید.", "expected": "جلسه بسته می‌شود و صفحه‌ی خلاصه‌ی پایان باز می‌شود."}, {"id": "LES-26", "step": "صفحه‌ی خلاصه را ببینید.", "expected": "خلاصه‌ی کوتاه، پنج معیار (هر کدام با یک سطح CEFR) و عبارت‌های این جلسه نشان داده می‌شود."}, {"id": "LES-27", "step": "جلسه را پایان دهید، بعد دوباره دکمه‌ی پایان را بزنید.", "expected": "دکمه‌ی پایان بعد از پایان جلسه غیرفعال است."}, {"id": "LES-28", "step": "جلسه را باز بگذارید و صفحه را ببندید (بدون پایان).", "expected": "وقتی دوباره وارد شوید، خلاصه‌ی جلسه ساخته شده است یا در حال ساخت است."}, {"id": "LES-29", "step": "دو جلسه‌ی درس همزمان برای یک زبان‌آموز شروع کنید.", "expected": "فقط یک جلسه فعال است."}]}, {"title": "۷.۴ شادوینگ، تلفظ و صدا (مرورگر)", "items": [{"id": "VOICE-01", "step": "دکمه‌ی میکروفون را بزنید و یک جمله بگویید.", "expected": "گفتار به متن تبدیل می‌شود و در کادر پیام می‌آید (Chrome یا Edge)."}, {"id": "VOICE-02", "step": "در ابزار توسعه‌گر (Network) بررسی کنید.", "expected": "هیچ فایل صوتی به سرور فرستاده نمی‌شود. فقط متن ارسال می‌شود."}, {"id": "VOICE-03", "step": "شریک را بپرسید که چه شنیده است.", "expected": "شریک فقط کلمه‌های تشخیص‌داده‌شده را می‌بیند."}, {"id": "VOICE-04", "step": "در حالت شادوینگ دکمه‌ی پخش نمونه‌صدا را بزنید.", "expected": "نمونه‌صدای لهجه‌ی انتخاب‌شده  "عبارتی را در دو گفتگوی جدا بدون کمک به‌کار ببرید.", "expected": "وضعیت «تسلط» می‌شود (عدد پیش‌فرض ۲)."}, {"id": "DATA-07", "step": "زمان مرور عبارت‌ها را ببینید.", "expected": "فاصله‌ها ۳، ۷، ۱۴ و ۳۰ روز هستند. عبارت مسلط بعد از آخرین فاصله ادامه پیدا می‌کند."}, {"id": "DATA-08", "step": "دو جلسه‌ی متوالی یک معیار را بالاتر از سطح فعلی بگذرانید.", "expected": "آن معیار یک پله بالا می‌رود. سایر معیارها تغییر نمی‌کنند."}, {"id": "DATA-09", "step": "سه جلسه‌ی متوالی یک معیار را پایین‌تر بگذرانید.", "expected": "آن معیار یک پله پایین می‌آید."}, {"id": "DATA-10", "step": "جلسه‌ای با کمتر از سه پیام از شما بسازید.", "expected": "وضعیت «بدون ارزیابی» است و روی سطح، عبارت‌ها و دفترچه اثری ندارد."}, {"id": "DATA-11", "step": "خطای روال پایان را شبیه‌سازی کنید (مثلاً کلید نامعتبر).", "expected": "جلسه «در انتظار پردازش» می‌شود. سامانه تا سه بار خودکار امتحان می‌کند. در پنل دکمه‌ی «پردازش دوباره» هست."}, {"id": "DATA-12", "step": "در حالت خطا، هیچ عدد یا دفترچه‌ای نیمه‌کاره ذخیره نشده باشد.", "expected": "همه‌یا‌هیچ: یا همه‌ی به‌روزرسانی‌ها انجام شده یا هیچ‌کدام."}, {"id": "DATA-13", "step": "پیام‌های گفتگوی آزاد را بعد از ۲۴ ساعت بررسی کنید.", "expected": "پیام‌ها پاک شده‌اند و خلاصه و عددها باقی مانده‌اند. (توسعه‌دهنده بررسی کند.)"}]}, {"title": "۱۰. دفترچه‌ی معلم", "items": [{"id": "NOTE-01", "step": "با حساب زبان‌آموز دنبال دفترچه بگردید.", "expected": "زبان‌آموز دفترچه را نمی‌بیند."}, {"id": "NOTE-02", "step": "بعد از یک جلسه، گفتگوی آزاد و آزمون، دفترچه را در پنل ببینید.", "expected": "دفترچه به‌روز شده و نسخه‌ی جدید ساخته شده است."}, {"id": "NOTE-03", "step": "دفترچه را بخوانید.", "expected": "تیترها قابل فهم‌اند، متن فارسی راست به چپ است و تعداد کلمات زیر سقف است."}, {"id": "NOTE-04", "step": "در پنل نسخه‌های قبلی دفترچه را ببینید و به یک نسخه‌ی قدیمی برگردید.", "expected": "برگشت کار می‌کند و نسخه‌ی جدید هم در تاریخچه می‌ماند."}, {"id": "NOTE-05", "step": "در پنل «پیش‌نمایش پرامپت» زبان‌آموز را باز کنید.", "expected": "بخش `[دفترچه‌ی معلم]` در پرامپت هست و متن دفترچ const KEY = "zaban-po-test-plan-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
}
function saveState(state) {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: the checklist still works */ }
}

const state = loadState();
const list = document.getElementById("list");
const items = [];

SECTIONS.forEach((section) => {
  if (!section.items.length) return;
  const isMain = /^[۰-۹]+\. /.test(section.title);
  const h = document.createElement(isMain ? "h2" : "h3");
  h.textContent = section.title;
  list.appendChild(h);
  section.items.forEach((it) => {
    const box = document.createElement("div");
    box.className = "item";
    const label = document.createElement("label");
    const check = document.createElement("input");
    check.type = "checkbox";
    const text = document.createElement("span");
    const idEl = document.createElement("span");
    idEl.className = "id";
    idEl.textContent = it.id;
    text.appendChild(idEl);
    text.appendChild(document.createTextNode(" " + it.step));
    const exp = document.createElement("div");
    exp.className = "expected";
    exp.textContent = "نتیجه‌ی مطلوب: " + it.expected;
    text.appendChild(exp);
    label.appendChild(check);
    label.appendChild(text);
    const note = document.createElement("input");
    note.type = "text";
    note.className = "note";
    note.placeholder = "یادداشت (اگر نتیجه فرق داشت، اینجا بنویسید)";
    const saved = state[it.id] || {};
    check.checked = !!saved.done;
    note.value = saved.note || "";
    function refresh() {
      const current = loadState();
      current[it.id] = { done: check.checked, note: note.value };
      saveState(current);
      update();
    }
    check.addEventListener("change", refresh);
    note.addEventListener("input", refresh);
    box.appendChild(label);
    box.appendChild(note);
    list.appendChild(box);
    items.push({ id: it.id, box, check, note, title: section.title, step: it.step, expected: it.expected });
  });
});

function update() {
  const done = items.filter((i) => i.check.checked).length;
  const pct = items.length ? Math.round((done / items.length) * 100) : 0;
  document.getElementById("summary").textContent = "انجام‌شده: " + done + " از " + items.length + " (" + pct + "٪)";
  document.getElementById("bar").style.width = pct + "%";
  items.forEach((i) => i.box.classList.toggle("done", i.check.checked));
  applyFilter();
}

function applyFilter() {
  const mode = document.getElementById("filter").value;
  items.forEach((i) => {
    const show = mode === "all" || (mode === "done" ? i.check.checked : !i.check.checked);
    i.box.classList.toggle("hidden", !show);
  });
}

document.getElementById("filter").addEventListener("change", applyFilter);

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("همه‌ی تیک‌ها و یادداشت‌ها پاک شوند؟")) return;
  items.forEach((i) => { i.check.checked = false; i.note.value = ""; });
  saveState({});
  update();
});

document.getElementById("export").addEventListener("click", () => {
  const lines = [];
  let title = "";
  items.forEach((i) => {
    if (i.title !== title) { title = i.title; lines.push("", title); }
    lines.push((i.check.checked ? "[x] " : "[ ] ") + i.id + " " + i.step + (i.note.value ? "  | یادداشت: " + i.note.value : ""));
  });
  const blob = new Blob([lines.join("\n").trim()], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "po-test-result.txt";
  a.click();
});

update();
</script>
</body>
</html>
